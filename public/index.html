<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Video Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button.play-btn {
            padding: 12px 20px;
            background: #0284c7;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        button.play-btn:hover {
            background: #0369a1;
        }
        button.play-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status {
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
            text-align: center;
        }
        .player-card {
            display: none;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }
        video {
            width: 100%;
            display: block;
            background: #000;
        }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px;
            background: #0f172a;
        }
        .skip-btn {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .skip-btn:active {
            background: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Online Video Player</h2>

    <div class="input-box">
        <input type="text" id="videoLink" placeholder="Paste link here...">
        <button class="play-btn" id="playBtn" onclick="playVideo()">Play Video</button>
    </div>

    <div id="status"></div>

    <div class="player-card" id="playerCard">
        <video id="mainVideo" controls playsinline preload="auto"></video>
        
        <div class="controls-bar">
            <button class="skip-btn" onclick="skip(-10)">⏪ 10 Sec Back</button>
            <button class="skip-btn" onclick="skip(10)">10 Sec Skip ⏩</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');

    async function playVideo() {
        const input = document.getElementById('videoLink');
        const btn = document.getElementById('playBtn');
        const status = document.getElementById('status');
        const playerCard = document.getElementById('playerCard');
        const link = input.value.trim();

        if (!link) {
            status.style.color = '#ef4444';
            status.innerText = 'অনুগ্রহ করে লিঙ্ক পেস্ট করুন!';
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Processing...';
        status.style.color = '#38bdf8';
        status.innerText = 'ভিডিও প্রসেস করা হচ্ছে...';

        try {
            const res = await fetch('/api/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ link: link })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                status.style.color = '#22c55e';
                status.innerText = 'Playing: ' + data.title;

                video.src = data.stream_url;
                playerCard.style.display = 'block';
                video.play();
            } else {
                status.style.color = '#ef4444';
                status.innerText = 'Error: ' + (data.message || 'ভিডিও পার্স করা সম্ভব হয়নি');
            }
        } catch (err) {
            console.error(err);
            status.style.color = '#ef4444';
            status.innerText = 'Server Error: ' + err.message;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Play Video';
        }
    }

    function skip(seconds) {
        if (video) {
            video.currentTime += seconds;
        }
    }
</script>

</body>
</html>
